name: Release assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза"
        required: true
        default: "v1.0.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: |
          pip install build
          python -m build
          mkdir -p /tmp/pyz/netpulse && cp netpulse/*.py /tmp/pyz/netpulse/
          python -m zipapp /tmp/pyz -m "netpulse.cli:main" -p "/usr/bin/env python3" -o dist/netpulse.pyz
          python dist/netpulse.pyz -V
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
